<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<meta name="description" content="A little internet den for a Draccoon!">
	<title>MintyPaws: Home</title>
	<link rel="icon" type="image/x-icon" href="/assets/minty/pfp.webp">
	<link rel="preload" href="/assets/font/VT323-Regular.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="stylesheet" href="/css/main.css">
	<link rel="stylesheet" href="/css/home.css">
	<script type="module" src="/js/home.js"></script>
</head>

<body>
	<div class="loader no-select" id="loader" role="status" aria-live="polite">
		<div class="throbber"></div>
		<h2>Collecting Trash...</h2>
	</div>

	<div id="header"></div>

	<div class="content">
		<div class="about-box box">
			<img src="/assets/minty/pfp.webp" class="enlargeable no-select" alt="Profile Picture">
			<div class="about-text">
				<h2 id="greeting">Heya!</h2>
				<p>Site is under reconstruction!<br>Somewhat old Page with a background test is found here: <a href="/wip/">/wip</a></p>
			</div>
		</div>

		<div class="fun-fact-box box">
			<h2>🦝 Raccoon Fun Fact of the Day</h2>
			<p class="fun-fact" id="raccoonFact">Loading Fact...</p>
		</div>

		<div class="image-box box">
			<h2>🎨 Random Raccoon Picture</h2>
			<div class="image-wrapper no-select">
				<div class="image-loading" id="image-loader">
					<div class="image-spinner"></div>
				</div>

				<img class="enlargeable" id="image-img" alt="A fun raccoon image appears here!">
			</div>

			<div class="image-box-subtext"><sup>Click the pic for a closer look!</sup></div>
			<button class="btn" id="next-img-btn">Show another!</button>
		</div>
	</div>

	<div id="footer"></div>
</body>
</html>
